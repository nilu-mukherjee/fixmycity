name: Build FixMyCity APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android_app/**"
      - ".github/workflows/flutter-build.yml"

jobs:
  build:
    # Real x86_64 Linux — object_detection's OpenCV dependency (dartcv4)
    # compiles native C++ via the Android NDK's clang at build time, which
    # only ships x86_64 host binaries. That step can't run on the arm64
    # sandbox this workflow was written in, which is the whole reason this
    # workflow exists.
    runs-on: ubuntu-latest

    # Needed to publish/update the `latest-apk` release below — the default
    # GITHUB_TOKEN is otherwise read-only on a private repo.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest only has ~14GB free after preinstalled tooling, which
      # isn't enough headroom for Android SDK/NDK + Gradle/pub caches +
      # build output all at once — a prior run OOM'd the disk trying to
      # save its cache at the end (build itself had already succeeded).
      # Reclaim space from large preinstalled SDKs this workflow never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/node_modules
          sudo docker image prune -af || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: "stable"
          cache: true

      # NDK download (~1-2GB) is otherwise fetched fresh every run.
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: ndk-28.2.13676358

      - name: Install Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      # The big one: object_detection's OpenCV dependency (dartcv4) compiles
      # native C++ via CMake/NDK on every `flutter build`. Its output lands
      # in android_app/.dart_tool/hooks_runner/shared/dartcv4/build/ (~12MB,
      # confirmed by inspecting a local partial build) — reusing it turns a
      # from-scratch native compile into a no-op on a cache hit.
      - name: Cache Gradle, pub, and native build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
            android_app/.dart_tool/hooks_runner
          key: flutter-build-${{ hashFiles('android_app/pubspec.lock', 'android_app/android/**/*.gradle*') }}
          restore-keys: |
            flutter-build-

      - name: flutter pub get
        working-directory: android_app
        run: flutter pub get

      - name: Decode release keystore
        working-directory: android_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/fixmycity-release.keystore
          cat > key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=fixmycity
          storeFile=fixmycity-release.keystore
          EOF

      - name: Build release APK
        working-directory: android_app
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL=https://fixmycity-1003427733440.asia-south1.run.app \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=1003427733440-mhrrgqgjcrrvr14vlmaso0s874hblqmq.apps.googleusercontent.com

      - name: Clean up keystore
        if: always()
        working-directory: android_app/android
        run: rm -f app/fixmycity-release.keystore key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: fixmycity-release-apks
          path: android_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      # A run artifact (above) requires GitHub auth just to reach the
      # download button and lands as a zipped folder of every ABI split —
      # not a one-click "Download Android app" link. A release asset is a
      # stable URL that serves the raw .apk directly with a
      # Content-Disposition: attachment header, so the site's download
      # button (src/components/site-nav.tsx) can link straight to it. The
      # `latest-apk` tag is reused/overwritten (`--clobber`) on every build
      # so the link never changes.
      - name: Publish latest-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create latest-apk --repo "$GITHUB_REPOSITORY" \
                 --title "FixMyCity Android (latest build)" \
                 --notes "Automatically rebuilt from the latest main branch commit. Not a versioned release — this tag is overwritten on every build."
          gh release upload latest-apk --repo "$GITHUB_REPOSITORY" --clobber \
            android_app/build/app/outputs/flutter-apk/*.apk
