name: Build FixMyCity APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android_app/**"
      - ".github/workflows/flutter-build.yml"

jobs:
  build:
    # Real x86_64 Linux — object_detection's OpenCV dependency (dartcv4)
    # compiles native C++ via the Android NDK's clang at build time, which
    # only ships x86_64 host binaries. That step can't run on the arm64
    # sandbox this workflow was written in, which is the whole reason this
    # workflow exists.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: "stable"

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      - name: flutter pub get
        working-directory: android_app
        run: flutter pub get

      - name: Decode release keystore
        working-directory: android_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/fixmycity-release.keystore
          cat > key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=fixmycity
          storeFile=fixmycity-release.keystore
          EOF

      - name: Build release APK
        working-directory: android_app
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL=https://fixmycity-1003427733440.asia-south1.run.app \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=1003427733440-mhrrgqgjcrrvr14vlmaso0s874hblqmq.apps.googleusercontent.com

      - name: Clean up keystore
        if: always()
        working-directory: android_app/android
        run: rm -f app/fixmycity-release.keystore key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: fixmycity-release-apks
          path: android_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
